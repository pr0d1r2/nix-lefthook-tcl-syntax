---
pre-commit:
  commands:
    tcl-syntax:
      glob: "*.{tcl,exp}"
      run: timeout ${LEFTHOOK_TCL_SYNTAX_TIMEOUT:-30} lefthook-tcl-syntax {staged_files}

pre-push:
  commands:
    tcl-syntax:
      glob: "*.{tcl,exp}"
      run: timeout ${LEFTHOOK_TCL_SYNTAX_TIMEOUT:-30} lefthook-tcl-syntax {push_files}
